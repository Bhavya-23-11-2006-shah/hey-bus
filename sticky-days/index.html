<title>Sticky Days</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: a desk with dotted paper. Top bar with a title she can rename, three tabs (bottom bar on phones),
   then one view: Board of sticky notes, Calendar with a ruled day pad, Memories as taped polaroids. */
:root{
  --bg:#e8edf5; --dot:#c6d0e2; --surface:#ffffff; --fg:#1d2230; --muted:#59627a; --line:#c8d0df;
  --accent:#2f5bff; --on-accent:#ffffff; --danger:#a81d37;
  --y:#ffe45e; --y-d:#f2cc2a; --p:#ff9ec4; --p-d:#f27bab; --m:#8fe3b5; --m-d:#62cc93;
  --s:#8ec9ff; --s-d:#62b0f2; --l:#c9aeff; --l-d:#a98af4; --o:#ffb98a; --o-d:#f59a5e;
  --ink:#2a2230; --ink-soft:#4d4259; --polaroid:#fbfbf7; --danger-bg:#b3203b;
  --shadow:0 1px 1px rgba(20,25,45,.14),0 10px 16px -8px rgba(20,25,45,.38);
  --f-ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-hand:'Caveat','Noto Sans Devanagari','Noto Sans Gujarati',cursive;
  --f-mark:'Permanent Marker','Caveat',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151d; --dot:#252b3c; --surface:#1d2230; --fg:#eaeef7; --muted:#a3abc0; --line:#343c52;
    --accent:#a3b7ff; --on-accent:#0f1530; --danger:#ff8fa2;
    --shadow:0 1px 1px rgba(0,0,0,.45),0 12px 18px -8px rgba(0,0,0,.75); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151d; --dot:#252b3c; --surface:#1d2230; --fg:#eaeef7; --muted:#a3abc0; --line:#343c52;
  --accent:#a3b7ff; --on-accent:#0f1530; --danger:#ff8fa2;
  --shadow:0 1px 1px rgba(0,0,0,.45),0 12px 18px -8px rgba(0,0,0,.75); color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg); background-image:radial-gradient(circle,var(--dot) 1.3px,transparent 1.7px);
  background-size:22px 22px; color:var(--fg); font-family:var(--f-ui); font-size:16px; line-height:1.4; margin:0;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{
  max-width:1080px; margin:0 auto; padding-block:1rem 6.5rem;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.ico{display:inline-grid;place-items:center;line-height:0}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.9rem}
.brand{margin:0;flex:1;min-width:0}
.title-input{
  width:100%;max-width:26rem;background:transparent;border:0;border-bottom:2px dashed transparent;
  font-family:var(--f-mark);font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.2;padding:.1rem 0;color:var(--fg);
}
.title-input:hover,.title-input:focus{border-bottom-color:var(--line)}
.title-input::placeholder{color:var(--muted)}

.ib{
  width:2.1rem;height:2.1rem;border:0;border-radius:50%;background:transparent;color:inherit;
  display:inline-grid;place-items:center;flex:none;
}
.ib:hover{background:rgba(128,128,128,.22)}
.ib.armed{width:auto;border-radius:999px;padding:0 .65rem;background:var(--danger-bg);color:#fff;font:800 .8rem var(--f-ui)}
.ib.solid{background:var(--surface);border:1px solid var(--line)}

/* nav */
.nav{
  display:flex;gap:.3rem;width:max-content;max-width:100%;margin:0 0 1.2rem;padding:.25rem;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
}
.tab{
  display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;border-radius:999px;text-decoration:none;
  color:var(--fg);font-weight:800;font-size:.95rem;
}
.tab[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
@media (max-width:640px){
  .nav{
    position:fixed;left:0;right:0;bottom:0;width:auto;max-width:none;margin:0;z-index:20;border-radius:0;
    border-width:1px 0 0;justify-content:space-around;
    padding:.4rem max(16px,env(safe-area-inset-right,0px)) calc(.4rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  }
  .tab{flex:1;justify-content:center;padding:.6rem .4rem}
}

.banner{
  background:var(--surface);border:2px dashed var(--danger);border-radius:8px;padding:.7rem .9rem;margin-bottom:1rem;
  font-weight:700;font-size:.92rem;
}

/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:.4rem;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);padding:.55rem 1rem;font-weight:800;font-size:.95rem;text-decoration:none;color:var(--fg);
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin:0 0 1.4rem}
.toolbar .grow{flex:1}

.swatches{display:inline-flex;gap:.35rem;align-items:center}
.sw{
  width:1.55rem;height:1.55rem;border-radius:50%;border:2px solid transparent;padding:0;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);
}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface),inset 0 0 0 1px rgba(0,0,0,.25)}
.sw-yellow{background:var(--y)} .sw-pink{background:var(--p)} .sw-mint{background:var(--m)}
.sw-sky{background:var(--s)} .sw-lilac{background:var(--l)} .sw-peach{background:var(--o)}

/* sticky notes */
.c-yellow{--paper:var(--y);--paper-d:var(--y-d)} .c-pink{--paper:var(--p);--paper-d:var(--p-d)}
.c-mint{--paper:var(--m);--paper-d:var(--m-d)} .c-sky{--paper:var(--s);--paper-d:var(--s-d)}
.c-lilac{--paper:var(--l);--paper-d:var(--l-d)} .c-peach{--paper:var(--o);--paper-d:var(--o-d)}
.note{
  --tick:var(--paper);position:relative;min-width:0;color:var(--ink);font-family:var(--f-hand);font-size:1.5rem;line-height:1.15;
  background:linear-gradient(180deg,var(--paper-d) 0 .5rem,var(--paper) .5rem);
  padding:.9rem .95rem 1rem;box-shadow:var(--shadow);transform:rotate(var(--r,0deg));
  transition:transform .18s ease,box-shadow .18s ease;
}
.note::after{
  content:"";position:absolute;right:0;bottom:0;width:1.5rem;height:1.5rem;
  background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.16) 50%);pointer-events:none;
}
.note:hover,.note:focus-within{transform:rotate(0deg) translateY(-2px)}
.note.pinned::before{
  content:"";position:absolute;left:50%;top:-.45rem;width:.95rem;height:.95rem;margin-left:-.47rem;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff8a8a,#c0262d 70%);box-shadow:0 2px 3px rgba(0,0,0,.35);
}
.note .ib{color:var(--ink);opacity:.6;width:1.9rem;height:1.9rem}
.note:hover .ib,.note:focus-within .ib,.note .ib:focus-visible,.note .ib[aria-pressed="true"]{opacity:1}
.note .ib[aria-pressed="true"]{background:rgba(0,0,0,.14)}
.note .ib.armed{opacity:1}
@media (hover:none){.note .ib{opacity:.85}}
.note :focus-visible{outline-color:var(--ink)}
.note-tools{display:flex;justify-content:flex-end;gap:.1rem;margin:-.25rem -.35rem .15rem}
.note-text,.li input,.ev-text,.cap-input{
  width:100%;background:transparent;border:0;padding:0;font:inherit;color:inherit;
}
.note-text{resize:none;display:block;min-height:6.4rem;overflow:hidden;outline:none}
.note-text::placeholder,.li input::placeholder,.ev-text::placeholder{color:var(--ink-soft);opacity:.8}
.note-text:focus-visible,.li input:focus-visible{outline:2px dashed var(--ink-soft);outline-offset:3px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:.2rem;min-height:5.5rem;align-content:start}
.li{display:flex;align-items:center;gap:.5rem}
.li input{min-width:0}
.li.done input{text-decoration:line-through;opacity:.6}
.add-item{
  margin-top:.45rem;background:transparent;border:0;padding:.1rem 0;font:inherit;color:var(--ink-soft);
  display:inline-flex;align-items:center;gap:.3rem;
}
.check{
  position:relative;flex:none;width:1.25rem;height:1.25rem;border:2px solid currentColor;border-radius:5px;background:transparent;padding:0;
  color:inherit;--tick:var(--surface);
}
.note .check{--tick:var(--paper)}
.check[aria-checked="true"]{background:currentColor}
.check[aria-checked="true"]::after{
  content:"";position:absolute;left:.3rem;top:.02rem;width:.3rem;height:.62rem;border:solid var(--tick);border-width:0 2.5px 2.5px 0;transform:rotate(40deg);
}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,165px),1fr));gap:1.7rem 1.3rem;align-items:start}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}

.today{max-width:34rem;margin:.4rem 0 1.6rem;padding-bottom:1.1rem}
.today-head{display:flex;align-items:center;gap:.9rem;margin-bottom:.5rem}
.day-num{font-family:var(--f-mark);font-size:3.6rem;line-height:1}
.dow{font-family:var(--f-mark);font-size:1.5rem;line-height:1.1}
.my{font-size:1.3rem;color:var(--ink-soft)}
.quick{display:flex;gap:.5rem;margin-top:.6rem}
.quick input{
  flex:1;min-width:0;background:rgba(255,255,255,.4);border:0;border-bottom:2px solid var(--ink-soft);padding:.25rem .4rem;font:inherit;color:inherit;border-radius:3px 3px 0 0;
}
.quick input::placeholder{color:var(--ink-soft)}
.quick button{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:.2rem .95rem;font:700 1.15rem var(--f-hand)}
.otd{display:block;margin-top:.7rem;color:var(--ink);font-size:1.2rem}
.muted-note{color:var(--ink-soft);margin:.2rem 0 0}

.ev-row{display:flex;align-items:center;gap:.5rem;min-height:2.2rem}
.ev-row.done .ev-text{text-decoration:line-through;opacity:.6}
.ev-text{min-width:0;flex:1}
.ev-dot{width:.9rem;height:.9rem;border-radius:50%;flex:none;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3);padding:0}
.ev-yearly{flex:none;color:#d6336c;line-height:0}

.empty{
  border:2px dashed var(--line);border-radius:10px;padding:2rem 1.2rem;text-align:center;background:var(--surface);
  display:grid;gap:.9rem;justify-items:center;
}
.empty p{margin:0;max-width:30ch}
.empty .big{font-family:var(--f-mark);font-size:1.5rem;max-width:none}

/* calendar */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:1.4rem;align-items:start}
@media (min-width:860px){.cal-wrap{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.8rem;box-shadow:var(--shadow)}
.cal-head{display:flex;align-items:center;gap:.4rem;margin-bottom:.6rem}
.cal-head h2{flex:1;margin:0;font-family:var(--f-mark);font-size:1.4rem;font-weight:400}
.dows,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dows span{text-align:center;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:.2rem 0}
.cell{
  position:relative;min-width:0;min-height:3.4rem;border:1px solid var(--line);border-radius:6px;background:transparent;
  text-align:left;padding:.25rem .3rem;display:flex;flex-direction:column;gap:.2rem;overflow:hidden;
}
.cell.blank{border:0;pointer-events:none}
.cell:hover{background:rgba(128,128,128,.14)}
.cell .num{font-weight:800;font-size:.85rem;width:1.5rem;height:1.5rem;display:grid;place-items:center;border-radius:50%}
.cell.today .num{background:var(--accent);color:var(--on-accent)}
.cell.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.cell .cam{position:absolute;right:.25rem;top:.3rem;color:var(--muted);line-height:0}
.chips{display:flex;flex-wrap:wrap;gap:3px;min-width:0}
.chip{
  display:block;max-width:100%;border-radius:3px;color:var(--ink);font:700 .95rem/1.1 var(--f-hand);padding:0 .3rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--paper);
}
.more{font-size:.7rem;font-weight:800;color:var(--muted)}
@media (min-width:640px){.cell{min-height:5.4rem}.chips{flex-direction:column;flex-wrap:nowrap}}
@media (max-width:639px){
  .chip{width:.55rem;height:.55rem;padding:0;font-size:0;border-radius:50%}
  .more{display:none}
}
.pad{
  background-color:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem 1rem 1.1rem;box-shadow:var(--shadow);
  background-image:repeating-linear-gradient(180deg,transparent 0 2.1rem,var(--line) 2.1rem calc(2.1rem + 1px));
  background-position:0 3.3rem;
}
.pad-title{margin:0 0 .7rem;font-family:var(--f-mark);font-weight:400;font-size:1.3rem;line-height:1.2}
.pad .ev-row{min-height:2.1rem;font-family:var(--f-hand);font-size:1.45rem}
.pad .ev-text{color:var(--fg)}
.pad-empty{margin:0;color:var(--muted);font-size:.95rem;padding:.3rem 0 .8rem}
.add-ev{display:grid;gap:.6rem;margin-top:1rem;background:var(--surface);padding:.7rem;border:1px solid var(--line);border-radius:8px}
.add-ev input[type="text"]{
  width:100%;border:1px solid var(--line);border-radius:6px;padding:.5rem .6rem;background:var(--bg);color:var(--fg);
}
.add-ev .row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between}
.add-ev label.yr{display:inline-flex;align-items:center;gap:.4rem;font-size:.9rem;font-weight:700}
.add-ev label.yr input{accent-color:var(--accent);width:1.1rem;height:1.1rem}
.day-thumbs{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem}
.day-thumbs button{
  width:3.6rem;height:3.6rem;padding:.2rem .2rem .55rem;border:0;background:var(--polaroid);box-shadow:var(--shadow);transform:rotate(var(--r,0deg));
}
.day-thumbs img{width:100%;height:100%;object-fit:cover;display:block}

/* memories */
.month{font-family:var(--f-mark);font-weight:400;font-size:1.3rem;margin:1.8rem 0 1rem}
.month:first-of-type{margin-top:.4rem}
.polas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:1.8rem 1.2rem;align-items:start}
@media (min-width:640px){.polas{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.polaroid{
  position:relative;display:block;width:100%;min-width:0;border:0;background:var(--polaroid);color:var(--ink);text-align:left;
  padding:.6rem .6rem .7rem;box-shadow:var(--shadow);transform:rotate(var(--r,0deg));transition:transform .18s ease;
}
.polaroid:hover{transform:rotate(0deg) translateY(-3px)}
.polaroid .tape{
  position:absolute;left:50%;top:-.6rem;width:4.2rem;height:1.3rem;margin-left:-2.1rem;transform:rotate(-3deg);
  background:rgba(255,228,94,.72);box-shadow:0 1px 2px rgba(0,0,0,.2);
}
.polaroid .ph{display:block;position:relative;width:100%;background:#d9dbe3;overflow:hidden}
.polaroid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.polaroid .cap{display:block;margin-top:.5rem;font-family:var(--f-hand);font-size:1.4rem;line-height:1.1;min-height:1.5rem;overflow-wrap:anywhere}
.polaroid .cap.none{color:#756b80}
.polaroid .when{display:block;font-size:.75rem;font-weight:800;letter-spacing:.04em;color:#5d5368}

/* lightbox */
.box{
  position:fixed;inset:0;z-index:50;background:rgba(8,10,18,.78);overflow:auto;display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.box[hidden]{display:none}
.box-card{
  width:min(100%,540px);background:var(--polaroid);color:var(--ink);padding:.8rem .8rem 1rem;box-shadow:0 18px 40px rgba(0,0,0,.5);display:grid;gap:.7rem;
}
.box-photo{position:relative;background:#14151a;display:grid;place-items:center}
.box-photo img{max-width:100%;max-height:min(58vh,520px);object-fit:contain;display:block}
.box-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(251,251,247,.9);color:var(--ink)}
.box-nav.prev{left:.4rem} .box-nav.next{right:.4rem}
.cap-input{
  font-family:var(--f-hand);font-size:1.6rem;line-height:1.15;resize:none;min-height:3.6rem;border-bottom:2px dashed #b7adc2;color:var(--ink);
}
.cap-input::placeholder{color:#756b80}
.box-meta{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between}
.box-meta input[type="date"]{border:1px solid #b7adc2;border-radius:6px;padding:.35rem .5rem;background:#fff;color:var(--ink);color-scheme:light}
.box-card .ib{color:var(--ink)}
.box-card .ib:hover{background:rgba(0,0,0,.1)}
.box-card .ib.armed{color:#fff}
.box-card :focus-visible{outline-color:var(--ink)}
.box-close{justify-self:end;margin:-.2rem -.2rem 0 0}
body.noscroll{overflow:hidden}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);z-index:60;bottom:1.2rem;max-width:calc(100% - 32px);
  background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:999px;font-weight:800;font-size:.9rem;box-shadow:var(--shadow);
}
.toast[hidden]{display:none}
@media (max-width:640px){.toast{bottom:calc(4.8rem + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){.note,.polaroid{transition:none}.note:hover,.note:focus-within,.polaroid:hover{transform:rotate(var(--r,0deg))}}
/* search pill — same colours and shapes as the rest of the app */
.searchbar{display:flex;align-items:center;gap:.5rem;margin:0 0 1.1rem;padding:.45rem .85rem;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.searchbar input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:inherit;padding:.15rem 0;outline:none}
/* the photo picker input stays off-screen but rendered, so phones (and the Android app) always open their photo chooser */
.file-in{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none}
</style>

<div class="app">
  <header class="top">
    <h1 class="brand"><input id="title" class="title-input" type="text" maxlength="30" aria-label="Board title" placeholder="Name your board"></h1>
    <button id="backup" class="ib solid" type="button" aria-label="Download my notes and memories" title="Download my notes and memories"></button>
    <button id="restore" class="ib solid" type="button" aria-label="Load a backup file" title="Load a backup file"></button>
    <button id="theme" class="ib solid" type="button" aria-label="Switch light or dark"></button>
  </header>
  <nav class="nav" aria-label="Sections" id="nav"></nav>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
</div>
<div id="box" class="box" hidden role="dialog" aria-modal="true" aria-label="Memory"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input id="file-in" class="file-in" type="file" accept="image/*" multiple>
<input id="backup-in" class="file-in" type="file" accept=".json,application/json">

    try{
      var r=indexedDB.open('sticky-days',1);
      r.onupgradeneeded=function(){var d=r.result;d.createObjectStore('kv');d.createObjectStore('photos',{keyPath:'id'})};
      r.onsuccess=function(){res(r.result)};
      r.onerror=function(){rej(r.error)};

  });

function tx(store,mode,fn){
  return new Promise(function(res,rej){
    var t=dbp.transaction(store,mode),s=t.objectStore(store),r=fn(s);
    t.oncomplete=function(){res(r&&r.result)};
    t.onerror=function(){rej(t.error)};
    t.onabort=function(){rej(t.error)};
  });
}

function loadImg(file){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){URL.revokeObjectURL(u);res(im)};
    im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('decode'))};
    im.src=u;
  });
}
/* Android pickers do not always give a file type, so nothing is filtered away:
   every chosen file is decoded, and only a real failure is reported. */
async function decodeImage(file){
  try{return await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){}
  try{return await loadImg(file)}catch(e){}
  var url=null;
  try{
    url=URL.createObjectURL(file);
    var res=await fetch(url),bm=await createImageBitmap(await res.blob());
    URL.revokeObjectURL(url);
    return bm;
  }catch(e){
    if(url)URL.revokeObjectURL(url);
    throw new Error('decode');
  }
}
async function processFile(file){
  var src=await decodeImage(file);
  var w=src.width||src.naturalWidth,hh=src.height||src.naturalHeight;
  if(!w||!hh){if(src.close)src.close();throw new Error('size')}
  var caps=[3200,2400,1600,1024],lastErr=null;
  for(var i=0;i<caps.length;i++){
    var sc=Math.min(1,caps[i]/Math.max(w,hh));
    var cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(hh*sc));
    try{
      var c=document.createElement('canvas');c.width=cw;c.height=ch;
      var cx=c.getContext('2d');
      if(!cx)throw new Error('canvas');
      cx.fillStyle='#fff';cx.fillRect(0,0,cw,ch);cx.drawImage(src,0,0,cw,ch);
      var out=c,blob=await new Promise(function(r){out.toBlob(r,'image/jpeg',0.92)});
      c.width=c.height=0;
      if(!blob)throw new Error('encode');
      if(src.close)src.close();
      return {blob:blob,w:cw,h:ch};
    }catch(e){lastErr=e}
  }
  if(src.close)src.close();
  throw lastErr||new Error('encode');
}
async function addFiles(files){

function backupFileName(){return 'sticky-days-backup-'+ymd(new Date())+'.json'}
function toBase64(str){
  var bytes=new TextEncoder().encode(str),out='',ch=0x8000;
  for(var i=0;i<bytes.length;i+=ch)out+=String.fromCharCode.apply(null,bytes.subarray(i,i+ch));
  return btoa(out);
}
function collectBackup(done){
  var out={app:'sticky-days',kind:'backup',version:1,exportedAt:new Date().toISOString(),
    board:{name:state.name,theme:state.theme},notes:state.notes,events:state.events,photos:[]};
  var list=photos.slice(),i=0;
  function step(){
    if(i>=list.length){done(JSON.stringify(out));return}
    var p=list[i++];
    var rec={id:p.id,caption:p.caption||'',date:p.date,tilt:p.tilt,w:p.w,h:p.h};
    var fr=new FileReader();
    fr.onload=function(){rec.dataUrl=String(fr.result||'');out.photos.push(rec);step()};
    fr.onerror=function(){step()};
    try{fr.readAsDataURL(p.blob)}catch(e){step()}
  }
  step();
}

/* --- pictures: a sticky note as JPG, a memory as a polaroid JPG ---
   PIC_SCALE = how many device pixels per design pixel. 3 = 3000px wide, print quality. */
var PIC_SCALE=3, PIC_QUALITY=0.98;
var PAPER={yellow:['#ffe45e','#f2cc2a'],pink:['#ff9ec4','#f27bab'],mint:['#8fe3b5','#62cc93'],sky:['#8ec9ff','#62b0f2'],lilac:['#c9aeff','#a98af4'],peach:['#ffb98a','#f59a5e']};

function cssVar(name,fallback){try{var v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();return v||fallback}catch(e){return fallback}}
function newCanvas(w,hh){var c=document.createElement('canvas');c.width=Math.round(w);c.height=Math.round(hh);return c}
function cropName(s,max){return String(s||'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').trim().slice(0,max||24).trim().replace(/\s+/g,'-')}
function blobToBase64(blob,done){

  fr.onload=function(){done(String(fr.result||'').replace(/^data:[^,]*,/,''))};
  fr.onerror=function(){done(null)};

function saveBlobToPhone(blob,name){

function withHandFont(fn){
  var p=null;
  try{if(document.fonts&&document.fonts.load)p=document.fonts.load(handFont(48))}catch(e){p=null}
  if(!p){fn();return}

}
function wrapLines(ctx,text,maxW){
  var out=[];
  String(text==null?'':text).split(/\r?\n/).forEach(function(par){
    var line='';
    par.split(/\s+/).forEach(function(w){
      if(!w)return;
      var t=line?line+' '+w:w;
      if(line&&ctx.measureText(t).width>maxW){out.push(line);line=w}
      else line=t;
    });
    if(line)out.push(line);
  });
  return out;
}
function paintDesk(ctx,w,hh){
  ctx.fillStyle=cssVar('--bg','#e8edf5');ctx.fillRect(0,0,w,hh);
  ctx.fillStyle=cssVar('--dot','#c6d0e2');
  for(var y=18;y<hh;y+=34){for(var x=18;x<w;x+=34){ctx.beginPath();ctx.arc(x,y,2.2,0,Math.PI*2);ctx.fill()}}
}
function drawCover(ctx,img,x,y,w,hh){
  var iw=img.width||img.naturalWidth||w,ih=img.height||img.naturalHeight||hh;
  if(!iw||!ih)return;
  var sc=Math.max(w/iw,hh/ih),sw=w/sc,sh=hh/sc;
  ctx.drawImage(img,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,hh);
}
function renderNoteImage(n){
  var W=1000,noteW=780,padX=64,padY=64,fs=48,lineH=64;
  var paper=PAPER[n.color]||PAPER.yellow;
  var m=document.createElement('canvas').getContext('2d');
  m.font=handFont(fs);
  var rows=[];
  if(n.type==='list'){
    (n.items||[]).forEach(function(it){
      var t=String(it.t||'').replace(/\s+$/,'');
      if(!t.trim())return;
      wrapLines(m,t,noteW-padX*2-64).forEach(function(ln,i){rows.push({t:ln,done:!!it.done,box:i===0})});
    });
    if(!rows.length)rows.push({t:'(empty checklist)'});
  }else{
    var txt=String(n.text||'').replace(/\s+$/,'');
    if(txt.trim())wrapLines(m,txt,noteW-padX*2).forEach(function(ln){rows.push({t:ln})});
    if(!rows.length)rows.push({t:'No words yet'});
  }
  var ROW_MAX=24;
  if(rows.length>ROW_MAX){rows=rows.slice(0,ROW_MAX);rows.push({t:'…'})}
  var noteH=padY+rows.length*lineH+padY+46;
  var ch=Math.max(560,noteH+190);
  // very tall notes drop to 2x so the canvas stays inside a phone's memory
  var S=noteH>1400?2:PIC_SCALE;
  var c=newCanvas(W*S,ch*S),ctx=c.getContext('2d');
  ctx.scale(S,S);
  paintDesk(ctx,W,ch);
  ctx.save();
  ctx.translate(W/2,ch/2);ctx.rotate(-1.2*Math.PI/180);ctx.translate(-noteW/2,-noteH/2);
  ctx.save();
  ctx.shadowColor='rgba(20,25,45,.34)';ctx.shadowBlur=34;ctx.shadowOffsetY=16;
  ctx.fillStyle=paper[0];ctx.fillRect(0,0,noteW,noteH);
  ctx.restore();
  var g=ctx.createLinearGradient(0,0,0,18);g.addColorStop(0,paper[1]);g.addColorStop(1,paper[0]);
  ctx.fillStyle=g;ctx.fillRect(0,0,noteW,18);
  ctx.beginPath();ctx.moveTo(noteW-58,noteH);ctx.lineTo(noteW,noteH-58);ctx.lineTo(noteW,noteH);ctx.closePath();
  ctx.fillStyle='rgba(0,0,0,.13)';ctx.fill();
  if(n.pin){
    var pg=ctx.createRadialGradient(noteW/2-5,-11,2,noteW/2,-6,16);
    pg.addColorStop(0,'#ff8a8a');pg.addColorStop(1,'#c0262d');
    ctx.beginPath();ctx.arc(noteW/2,-6,15,0,Math.PI*2);ctx.fillStyle=pg;ctx.fill();
  }
  ctx.textBaseline='top';ctx.font=handFont(fs);
  rows.forEach(function(r,i){
    var y=padY+i*lineH,x=padX;
    if(r.box){
      var bx=padX,by=y+14,bs=32;
      ctx.lineWidth=4;ctx.strokeStyle='#2a2230';ctx.strokeRect(bx,by,bs,bs);
      if(r.done){
        ctx.fillStyle='#2a2230';ctx.fillRect(bx+5,by+5,bs-10,bs-10);
        ctx.strokeStyle=paper[0];ctx.lineWidth=5;ctx.beginPath();
        ctx.moveTo(bx+9,by+bs/2);ctx.lineTo(bx+15,by+bs-11);ctx.lineTo(bx+bs-8,by+9);ctx.stroke();
      }
      x=padX+58;
    }
    ctx.fillStyle=r.done?'rgba(42,34,48,.55)':'#2a2230';
    ctx.fillText(r.t,x,y+8);
  });
  ctx.font=handFont(30,500);ctx.fillStyle='rgba(77,66,89,.9)';
  ctx.fillText((state.name||'Sticky Days')+' · '+fmt(todayStr(),{day:'numeric',month:'short',year:'numeric'}),padX,noteH-48);
  ctx.restore();
  return c;
}
function renderPolaroidImage(p,img){
  var W=1000,frameW=800,pad=44,topPad=92,capFs=58;
  var photoW=frameW-pad*2;
  var ar=(p.w&&p.h)?(p.w/p.h):1.3;
  var photoH=Math.max(380,Math.min(880,Math.round(photoW/ar)));
  var m=document.createElement('canvas').getContext('2d');
  m.font=handFont(capFs);
  var capAll=(p.caption&&p.caption.trim())?wrapLines(m,p.caption.trim(),photoW):[];
  var cap=capAll.slice(0,3);
  if(capAll.length>3)cap[2]=cap[2]+'…';
  var frameH=topPad+photoH+26+(cap.length?cap.length*66+64:84);
  var ch=frameH+180;
  var S=frameH>1300?2:PIC_SCALE;
  var c=newCanvas(W*S,ch*S),ctx=c.getContext('2d');
  ctx.scale(S,S);
  paintDesk(ctx,W,ch);
  ctx.save();
  ctx.translate(W/2,ch/2);ctx.rotate((p.tilt||0)*Math.PI/180);ctx.translate(-frameW/2,-frameH/2);
  ctx.save();
  ctx.shadowColor='rgba(20,25,45,.4)';ctx.shadowBlur=34;ctx.shadowOffsetY=18;
  ctx.fillStyle=cssVar('--polaroid','#fbfbf7');ctx.fillRect(0,0,frameW,frameH);
  ctx.restore();
  ctx.fillStyle='#d9dbe3';ctx.fillRect(pad,topPad,photoW,photoH);
  drawCover(ctx,img,pad,topPad,photoW,photoH);
  ctx.textBaseline='top';
  if(cap.length){
    ctx.font=handFont(capFs);ctx.fillStyle='#2a2230';
    cap.forEach(function(ln,i){ctx.fillText(ln,pad,topPad+photoH+30+i*66)});
  }
  ctx.font=handFont(30,500);ctx.fillStyle='#5d5368';
  ctx.fillText(fmt(p.date,{day:'numeric',month:'short',year:'numeric'}),pad,frameH-52);
  ctx.save();
  ctx.translate(frameW/2,-16);ctx.rotate(-3*Math.PI/180);
  ctx.globalAlpha=.82;ctx.fillStyle='#ffe45e';ctx.fillRect(-110,0,220,52);
  ctx.restore();
  ctx.restore();
  return c;
}
function downloadNote(n,share){
  toast(share?'Getting your note ready to share...':'Making your note picture...',true);
  withHandFont(function(){
    var c=renderNoteImage(n);
    c.toBlob(function(b){
      if(!b){toast('Could not make the picture.');return}
      var s=cropName(n.type==='list'?((n.items&&n.items[0]&&n.items[0].t)||''):(n.text||''));
      var name='sticky-note-'+ymd(new Date())+(s?'-'+s:'')+'.jpg';
      if(share&&shareBlob(b,name))return;
      saveBlobToPhone(b,name);
    },'image/jpeg',PIC_QUALITY);
  });
}
function downloadMemory(p,share){
  toast(share?'Getting your polaroid ready to share...':'Making your polaroid...',true);
  withHandFont(function(){
    loadImg(p.blob).then(function(img){
      var c=renderPolaroidImage(p,img);
      c.toBlob(function(b){
        if(!b){toast('Could not make the picture.');return}
        var s=cropName(p.caption);
        var name='memory-'+p.date+(s?'-'+s:'')+'.jpg';
        if(share&&shareBlob(b,name))return;
        saveBlobToPhone(b,name);
      },'image/jpeg',PIC_QUALITY);
    }).catch(function(){toast('Could not read that photo.')});
  });
}

function downloadBackup(){

/* ---------- search ---------- */
var query='';
function searchBar(){

  });

function noteSearchText(n){
  var t=String(n.text||'');
  if(n.type==='list')t+=' '+(n.items||[]).map(function(i){return String(i.t||'')}).join(' ');
  return t.toLowerCase();
}

/* ---------- restore a backup ---------- */
function dataUrlToBlob(u){
  return new Promise(function(res,rej){
    try{
      var parts=String(u||'').split(',');
      var mime=(parts[0].match(/:(.*?);/)||[])[1]||'image/jpeg';
      var bin=atob(parts[1]||''),len=bin.length,arr=new Uint8Array(len);
      for(var i=0;i<len;i++)arr[i]=bin.charCodeAt(i);
      res(new Blob([arr],{type:mime}));
    }catch(e){rej(e)}
  });
}
function restoreBackup(file){
  var fr=new FileReader();
  fr.onload=function(){
    var data=null;
    try{data=JSON.parse(String(fr.result||''))}catch(e){data=null}
    if(!data||data.app!=='sticky-days'){toast('That file is not a Sticky Days backup.');return}
    if(!window.confirm('Load this backup? It replaces the notes, plans and memories on this phone.'))return;
    applyBackup(data);
  };
  fr.onerror=function(){toast('Could not read that file.')};
  fr.readAsText(file);
}
async function applyBackup(data){
  toast('Restoring your backup...',true);
  try{
    state.name=(data.board&&typeof data.board.name==='string')?data.board.name:state.name;
    state.theme=(data.board&&data.board.theme==='dark')?'dark':'';
    state.notes=normalizeNotes(data.notes);
    state.events=normalizeEvents(data.events);
    query='';
    photos.forEach(function(p){if(p.url)URL.revokeObjectURL(p.url)});
    photos=[];
    if(dbp){try{await tx('photos','readwrite',function(s){return s.clear()})}catch(e){}}
    var list=Array.isArray(data.photos)?data.photos:[],added=0;
    for(var i=0;i<list.length;i++){
      var rec=list[i];
      // A record without real image data would only become a broken polaroid.
      if(!rec||typeof rec.dataUrl!=='string'||rec.dataUrl.indexOf('data:image')!==0) continue;
      try{
        var blob=await dataUrlToBlob(rec.dataUrl);
        if(!blob.size) continue;
        await decodeImage(blob); // only real pictures become memories
        var p={id:rec.id||uid(),caption:rec.caption||'',date:rec.date||todayStr(),tilt:typeof rec.tilt==='number'?rec.tilt:rnd(),w:rec.w,h:rec.h,blob:blob};
        if(dbp)await savePhoto(p);
        p.url=URL.createObjectURL(blob);photos.push(p);added++;
      }catch(e){}
    }
    $('#title').value=state.name;
    applyTheme();saveNow();renderCurrent();
    toast('Backup restored: '+state.notes.length+' notes, '+added+(added===1?' memory':' memories'));
  }catch(e){toast('Could not restore that backup.')}
}

/* ---------- share straight to another app ---------- */
function shareBlob(blob,name){
  var bridge=window.AndroidShare;
  if(!bridge||typeof bridge.shareFile!=='function')return false;
  blobToBase64(blob,function(b64){
    if(!b64){toast('Could not prepare the picture.');return}
    try{bridge.shareFile(name,b64)}
    catch(e){toast('Could not share on this phone.')}
  });
  return true;
}


/* ---------- reminders (Android app only) ---------- */
function pushReminders(){
  var bridge=window.AndroidReminders;
  if(!bridge||typeof bridge.schedule!=='function')return;
  var out=[];
  state.events.forEach(function(e){
    if(!e.remind||!e.date||!String(e.text||'').trim())return;
    out.push({id:e.id,date:e.date,text:e.text,yearly:!!e.yearly});
  });
  try{bridge.schedule(JSON.stringify(out))}catch(e){}
}

/* ---------- one automatic backup a week (Android app only) ---------- */
async function maybeAutoBackup(){
  if(!(window.AndroidBackup&&typeof window.AndroidBackup.saveFile==='function'))return;
  var last=0;
  try{if(dbp)last=(await tx('kv','readonly',function(s){return s.get('lastAutoBackup')}))||0}catch(e){last=0}
  var now=Date.now();
  if(typeof last==='number'&&now-last<7*864e5)return;
  collectBackup(function(json){
    try{
      window.AndroidBackup.saveFile('sticky-days-auto-backup-'+ymd(new Date())+'.json',toBase64(json));
      if(dbp)tx('kv','readwrite',function(s){return s.put(now,'lastAutoBackup')}).catch(function(){});
      toast('Weekly backup saved to Downloads');
    }catch(e){}
  });
}

/* Save immediately when the app goes to the background, so a quick swipe-away
   can never lose the last words she typed. */
function flushSave(){clearTimeout(saveT);saveNow()}
document.addEventListener('visibilitychange',function(){if(document.hidden)flushSave()});
window.addEventListener('pagehide',flushSave);
window.addEventListener('beforeunload',flushSave);

$('#backup').replaceChildren(icon('down',18));
$('#backup').addEventListener('click',downloadBackup);
$('#restore').replaceChildren(icon('up',18));
$('#restore').addEventListener('click',function(){$('#backup-in').click()});
$('#backup-in').addEventListener('change',function(){var f=this.files&&this.files[0];this.value='';if(f)restoreBackup(f)});

init();
})();
